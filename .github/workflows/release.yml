name: Release

# Push a tag like v0.1.0 (after bumping the version + CHANGELOG, see CHANGELOG.md):
#   git tag v0.1.0 && git push origin v0.1.0
# -> checks the tag matches the package version, builds, creates a GitHub Release with
#    the changelog notes and the wheel/sdist, and (once configured) publishes to PyPI.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tag must match the package version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' fl-studio-mcp/pyproject.toml)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject v$v"; exit 1; }
      - run: brew install ffmpeg
      - run: cd fl-studio-mcp && uv sync --extra dev && uv run ruff check . && uv run pytest -q
      - run: cd fl-studio-mcp && uv build
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG section for $v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: fl-studio-mcp/dist/*
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: fl-studio-mcp/dist/*

  pypi:
    # Needs one-time setup: on PyPI add a pending "trusted publisher" for project fl-mcp
    # (owner jagdeepsinghdev, repo fl-studio-mcp, workflow release.yml, environment pypi),
    # then create a GitHub environment named "pypi". Until then this job just fails;
    # the GitHub Release above is unaffected.
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
