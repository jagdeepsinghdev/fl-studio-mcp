[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-mcp"
version = "0.1.0"
description = "MCP server for controlling FL Studio - mixer, transport, channels, plugins, and piano roll"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "jagdeep Singh" },
    { name = "Karl Andres" },
]
keywords = ["mcp", "fl-studio", "midi", "daw", "music-production", "piano-roll"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastmcp>=2.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "pynput>=1.7",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/jagdeepsinghdev/fl-studio-mcp"
Repository = "https://github.com/jagdeepsinghdev/fl-studio-mcp"
Issues = "https://github.com/jagdeepsinghdev/fl-studio-mcp/issues"
Changelog = "https://github.com/jagdeepsinghdev/fl-studio-mcp/blob/main/CHANGELOG.md"
Upstream = "https://github.com/karl-andres/fl-studio-mcp"

[project.optional-dependencies]
dev = [
    "fl-studio-api-stubs>=37.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
fl-mcp = "fl_studio_mcp.server:main"
fl-studio-mcp = "fl_studio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

# The SOURCE distribution (sdist, .tar.gz) must be small and clean. By default hatch
# includes the *entire project directory*, which was dragging in a 34MB demo video
# (assets/scuffed_demo.mp4) and the FL-embedded runtime (fl_controller/). Build the
# sdist from an explicit file list instead: source code, docs, presets (the product),
# tests, and installer scripts — nothing binary.
[tool.hatch.build.targets.sdist]
include = [
    "src/**",
    "tests/**",
    "presets/**",
    "scripts/**",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "install.sh",
    "install.ps1",
    "build-track.sh",
    "apply-melody.sh",
]
# Be explicit about the big binary so a future rename can't re-bloat the sdist.
exclude = [
    "assets/**",
    "fl_controller/**",
    ".venv/**",
    "**/__pycache__/**",
    "**/*.mp4",
    "**/*.wav",
    "uv.lock",
]

[tool.uv]
# cryptography >=49 ships macOS wheels for arm64 only; on Intel Macs it falls
# back to a source build (needs Rust + OpenSSL). 48.x still has universal2
# wheels and satisfies joserfc's cryptography>=45.0.1 requirement.
constraint-dependencies = ["cryptography<49"]

[dependency-groups]
dev = [
    "fl-studio-api-stubs>=37.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# fl_controller/ runs *inside* FL Studio's embedded Python (it imports Image-Line's
# private `flp`/`flpianoroll` modules that don't exist outside FL). It must never be
# linted or imported by the MCP-side tooling, so keep it out of ruff's scope.
# presets/ is excluded too: validate.py is a flat, stdlib-only script meant to run
# directly from a terminal without a venv.
exclude = ["fl_controller/", "presets/"]

[tool.ruff.lint]
# F (pyflakes: unused imports/vars, undefined names), I (import order), W (warnings).
# E501 (line length) is intentionally NOT enabled: the FL-facing runtime in src/
# and fl_controller/ has long lines that are correct as-is; enforcing a hard
# reformat on working MIDI/FL code for a cosmetic rule would risk the thing that
# actually talks to FL. Keep line-length above as a soft guideline.
select = ["F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from another test module are "redefined" as test args
"tests/*" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
